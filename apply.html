<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Job - SHISHA GRAPHIC DESIGN</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin-bottom: 5px;
        }

        header p {
            color: #ccc;
            font-size: 14px;
        }

        .logout {
            background: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .job-title {
            text-align: center;
            color: #007bff;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        input[readonly] {
            background: #f1f1f1;
        }

        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
        }

        .checkbox input {
            width: auto;
            margin-top: 3px;
        }

        .checkbox label {
            margin: 0;
            font-weight: normal;
        }

        .apply-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .apply-btn:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>

    <div>
        <h2>SHISHA GRAPHIC DESIGN</h2>
        <p>Placement Management System</p>
    </div>

    <a href="/logout" class="logout">Logout</a>

</header>


<div class="container">

    <h1>Job Application</h1>

    <div class="job-title">
        Applying for: <strong>{{ job.job_title }}</strong>
    </div>


    <form action="/apply/{{ job.id }}" method="POST" enctype="multipart/form-data">

        <label>Full Name</label>
        <input type="text" name="name" value="{{ student.name }}" readonly>


        <label>Email</label>
        <input type="email" name="email" value="{{ student.email }}" readonly>


        <label>Phone Number</label>
        <input type="text" name="phone" value="{{ student.phone }}" readonly>


        <label>Qualification / Degree</label>
        <input type="text" name="qualification" value="{{ student.department }}" readonly>


        <label>CGPA</label>
        <input type="text" name="cgpa" value="{{ student.cgpa }}" readonly>


        <label>Skills</label>
        <textarea name="skills" readonly>{{ student.skills }}</textarea>


        <label>Upload Resume</label>
        <input type="file" name="resume" accept=".pdf,.doc,.docx" required>


        <div class="checkbox">
            <input type="checkbox" id="confirm" name="confirm" required>

            <label for="confirm">
                I confirm that the information provided above is correct.
            </label>
        </div>


        <button type="submit" class="apply-btn">
            Submit Application
        </button>

    </form>


    <a href="/job/{{ job.id }}" class="back">
        ← Back to Job Details
    </a>

</div>

</body>
</html>
